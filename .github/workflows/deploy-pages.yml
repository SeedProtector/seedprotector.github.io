# ============================================================
# GitHub Pages 部署 — 自动从 Secrets 注入敏感配置
# ============================================================
# 在仓库 Settings > Secrets and variables > Actions 中添加：
#   SEED_CONTACT_EMAIL        — 联系邮箱
#   SEED_EMAILJS_PUBLIC_KEY   — EmailJS Public Key（可选）
#   SEED_EMAILJS_SERVICE_ID   — EmailJS Service ID（可选）
#   SEED_EMAILJS_TEMPLATE_ID  — EmailJS Template ID（可选）
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - './**'
      - '.github/workflows/deploy-pages.yml'
      - 'inject_env.sh'
  workflow_dispatch: # 允许手动触发

# 设置 GITHUB_TOKEN 权限以部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，但不取消正在运行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into site.json
        env:
          SEED_CONTACT_EMAIL: ${{ secrets.SEED_CONTACT_EMAIL }}
          SEED_EMAILJS_PUBLIC_KEY: ${{ secrets.SEED_EMAILJS_PUBLIC_KEY }}
          SEED_EMAILJS_SERVICE_ID: ${{ secrets.SEED_EMAILJS_SERVICE_ID }}
          SEED_EMAILJS_TEMPLATE_ID: ${{ secrets.SEED_EMAILJS_TEMPLATE_ID }}
        run: bash ./inject_env.sh --env-only

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
